name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # The package's postinstall installs an agent skill into $HOME; skip it for the dependency
        # install only. The test step must NOT set this — postinstall tests assert the real behavior.
        env:
          ASKNEWS_NO_AGENT_SKILLS: "1"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # Bundle from the committed OpenAPI snapshot (deterministic, no network).
      - run: pnpm build:bundle
